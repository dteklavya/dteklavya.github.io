    [params.summary]
        enable = true
        text = "I'm a hands-on backend and DevOps engineer with several years of experience building reliable, scalable systems in Python. \n\nMy core tech stack centers on Python, Django, FastAPI, Docker, Linux, and cloud platforms like AWS, complemented by strong skills in CI/CD, GitHub-based workflows, and containerized microservices.\n\nI have worked extensively with asynchronous workers, message brokers, and databases, including Celery, Redis, and PostgreSQL/MySQL. In recent years, I have been deepening my focus on DevOps and DevSecOps, integrating security scanning, infrastructure-as-code, and automated quality gates into CI/CD pipelines. I thrive in Linux-centric environments.\n\nI’ve worked in all kinds of teams — large, small, remote, distributed, fast-paced and steady. For the last few years, I’ve been freelancing, which has been both freeing and demanding in the best possible way. It’s pushed me to keep learning, stay sharp, and step outside my comfort zone. I love the mix of flexibility and challenge it brings."








